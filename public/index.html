<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HanstlerS</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="layout">
  <aside id="sidebar">
    <button id="btn-newconv" title="Nueva conversación">＋ Nueva conversación</button>
    <div id="sidebar-tabs">
      <button id="tab-conv" class="side-tab active" type="button">Conversaciones</button>
      <button id="tab-repo" class="side-tab" type="button">Repos</button>
    </div>
    <input id="conv-search" type="text" placeholder="🔍 Buscar conversaciones…" autocomplete="off" />
    <div id="conv-list" class="side-list"></div>
    <div id="repo-list" class="side-list" style="display:none"></div>
  </aside>
  <div id="mainpane">
  <header id="topbar">
    <button id="btn-toggle" title="Mostrar/ocultar historial">☰</button>
    <div class="brand">
      <span class="logo">H</span>
      <div class="brand-text">
        <strong>HanstlerS</strong>
        <small>tu asistente personal</small>
      </div>
    </div>
    <div class="cwd" id="cwd" title="Carpeta de trabajo">~</div>
    <div class="actions">
      <div id="usage-meter" title="Consumo aproximado de esta sesión">·</div>
      <div id="usage-meter-google" title="Consumo de modelos Google (Vertex AI)">·</div>
      <button id="btn-diagnose" class="icon-btn" title="Diagnosticar por qué no responde"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6a4 4 0 0 1-8 0V2"/><path d="M4 8a8 8 0 0 0 8 8 8 8 0 0 0 8-8"/><circle cx="20" cy="10" r="2"/></svg></button>
      <button id="btn-theme" class="icon-btn" title="Cambiar tema (Ctrl+T)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg></button>
      <button id="btn-autostart" class="icon-btn" title="Iniciar con Windows"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button>
      <button id="btn-export" class="icon-btn" title="Exportar conversación"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
      <button id="btn-trust" class="icon-btn wide" title="Modo confianza: ejecutar sin confirmaciones"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span id="trust-label">Trust</span></button>
      <button id="btn-folder" class="icon-btn wide" title="Elegir carpeta de proyecto"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Carpeta</span></button>
    </div>
  </header>

  <main id="chat">
    <div class="msg bot">
      <div class="avatar">H</div>
      <div class="bubble">¡Hola! Soy <strong>HanstlerS</strong>. Elige tu carpeta de proyecto arriba y dime en qué trabajamos. Puedo leer y editar archivos, ejecutar comandos y usar tu agente <code>hanstler-dev</code>.</div>
    </div>
  </main>

  <section id="xcore-player" style="display:none">
    <div id="xcore-head">
      <strong>X-CORE Player</strong>
      <label id="xcore-upload-btn" title="Agregar audio">
        <input id="xcore-audio-input" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm,.aac,.flac" multiple style="display:none">
        + Audio
      </label>
    </div>
    <div id="xcore-now">Sin track seleccionado.</div>
    <audio id="xcore-audio" controls preload="metadata"></audio>
    <div id="xcore-list"></div>
  </section>

  <form id="composer">
    <textarea id="input" rows="3" placeholder="Escribe o pulsa 🎤 para hablar…  (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
    <div id="composer-bar">
      <div class="left-tools">
        <select id="model-sel" title="Modelo (velocidad vs. calidad)"></select>
        <span id="mode-chip" title="Modo de envío actual">Conversación</span>
      </div>
      <div class="right-tools">
        <button id="btn-attach" type="button" class="mic" title="Adjuntar documento o imagen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/></svg></button>
        <button id="btn-mic" type="button" class="mic" title="Hablar (dictar por voz)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg></button>
        <button id="btn-speak" type="button" class="speak" title="Leer las respuestas en voz alta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg></button>
        <button id="send" type="submit" title="Enviar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
      </div>
    </div>
  </form>
  </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
