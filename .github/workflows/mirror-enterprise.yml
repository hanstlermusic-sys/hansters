name: Mirror to enterprise

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      MIRROR_TARGET_REPO: cezumbad_microsoft/hansters
    steps:
      - name: Check mirror configuration
        id: mirror_config
        env:
          MIRROR_SSH_PRIVATE_KEY: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$MIRROR_SSH_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.mirror_config.outputs.enabled == 'true' }}
        with:
          fetch-depth: 0

      - name: Start SSH agent
        if: ${{ steps.mirror_config.outputs.enabled == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}

      - name: Configure mirror remote
        if: ${{ steps.mirror_config.outputs.enabled == 'true' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote remove mirroring || true
          git remote add mirroring "git@github.com:${{ env.MIRROR_TARGET_REPO }}.git"

      - name: Push branches and tags to mirror
        if: ${{ steps.mirror_config.outputs.enabled == 'true' }}
        run: |
          git push mirroring --prune "+refs/heads/*:refs/heads/*"
          git push mirroring --prune "+refs/tags/*:refs/tags/*"

      - name: Mirror not configured
        if: ${{ steps.mirror_config.outputs.enabled != 'true' }}
        run: |
          echo "Mirror skipped: configure MIRROR_SSH_PRIVATE_KEY to enable enterprise mirroring."
